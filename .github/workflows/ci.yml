name: CI

# .NET-only workflow of the 0.2.x maintenance branch (release/dotnet-0.2,
# cut from v0.2.0). Go, Python, example images and dev publishing live on
# main and the 0.3 branch. Never trigger on `v*` tags: only `dotnet/v*`
# publishes from this branch.
on:
  push:
    branches: [release/dotnet-0.2]
    tags: ['dotnet/v*']
  pull_request:
    branches: [release/dotnet-0.2]

permissions:
  contents: read

jobs:
  dotnet-test:
    name: .NET ${{ matrix.tfm }} (test + coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each leg runs its own target framework on its own runtime. The SDK
        # 10 builds both TFMs (SDK 8 cannot, NETSDK1045); the net8.0 leg also
        # installs the 8.0 runtime. No DOTNET_ROLL_FORWARD: a leg that ran on
        # another runtime fails RuntimeMetricNamesTests.
        include:
          - tfm: net8.0
            dotnet: |
              8.0.x
              10.0.x
          - tfm: net10.0
            dotnet: '10.0.x'
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet --info
      - run: dotnet --list-runtimes
      - run: dotnet restore OtelHelper.Tests/OtelHelper.Tests.csproj
      - run: >
          dotnet test OtelHelper.Tests
          -f ${{ matrix.tfm }}
          --configuration Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./coverage/${{ matrix.tfm }}/
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[xunit*]*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dotnet-coverage-${{ matrix.tfm }}
          path: dotnet/OtelHelper.Tests/coverage/${{ matrix.tfm }}/

  publish-dotnet-release:
    name: Publish .NET release to GitHub NuGet
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [dotnet-test]
    # .NET versions diverge from Go/Python (ADR-004): only dotnet/vX.Y.Z publishes NuGet.
    if: startsWith(github.ref, 'refs/tags/dotnet/v')
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#dotnet/v}" >> "$GITHUB_OUTPUT"
      # The tag must match the <Version> of every project, so the published
      # version is the one the source declares.
      - name: Tag matches every project <Version>
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          status=0
          for proj in OtelHelper OtelHelper.AWS OtelHelper.Redis OtelHelper.Sql OtelHelper.Profiling; do
            declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$proj/$proj.csproj" | head -n 1)
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::$proj/$proj.csproj <Version> is '$declared', the tag says '$VERSION'"; status=1
            fi
          done
          exit $status
      - name: Pack release version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for proj in OtelHelper OtelHelper.AWS OtelHelper.Redis OtelHelper.Sql OtelHelper.Profiling; do
            dotnet pack "$proj/$proj.csproj" \
              -c Release \
              -o nupkgs \
              /p:Version="$VERSION" \
              /p:RepositoryUrl="https://github.com/StaffOps/otel-libs"
          done
      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push nupkgs/*.nupkg \
            --source "https://nuget.pkg.github.com/StaffOps/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
