# Keeps the SHA-pinned actions (publish jobs, build-lib-node) current: Dependabot
# bumps the SHA and its "# vX.Y.Z" comment together (task B13 fix round).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be 7 days old before Dependabot proposes it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
