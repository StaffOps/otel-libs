# Backstage catalog: Domain (GitHub org) -> System (this repo) -> Component(s),
# one Component per published library family.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: otel-libs
  title: otel-libs
  description: "OpenTelemetry helper libraries for Go, Python, .NET and Node.js: one functionally equivalent setup per language (OTLP to the Collector, env-var contract, parity-tested)"
  annotations:
    github.com/project-slug: StaffOps/otel-libs
  links:
    - url: https://github.com/StaffOps/otel-libs
      title: Repository
      icon: github
spec:
  owner: group:staffops
  domain: staffops
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: otel-helper-go
  title: otel-helper (Go)
  description: "Go OpenTelemetry helper, module github.com/staffops/otel-libs/go, with opt-in ext modules (otelsql, otelredis, otelaws)"
  annotations:
    github.com/project-slug: StaffOps/otel-libs
  tags: [go, opentelemetry]
spec:
  type: library
  lifecycle: production
  owner: group:staffops
  system: otel-libs
---
