// Shared RPC contract of the otel-libs demo (specs/demo-environment, DE-D3).
// Every language's api (gRPC client) and backend (gRPC server) uses this file:
// Go commits generated stubs (go/demo/gen, regenerated by go/demo/gen.sh),
// Python generates at image build, Node.js loads it at run time, .NET uses
// Grpc.Tools at build. Changing it requires a Go regeneration (CI checks it).
syntax = "proto3";

package demo.v1;

option go_package = "github.com/staffops/otel-libs/go/demo/gen/otellibs/demo/v1;demov1";
option csharp_namespace = "StaffOps.OtelLibs.Demo.V1";

// OrderService is the backend's API. The gRPC status carries the outcome of a
// failed order with a constant message (design "Scenario table"):
// FAILED_PRECONDITION "order rejected" (business_error) and ALREADY_EXISTS
// "order exists" (db_error).
service OrderService {
  // PlaceOrder processes one order in the backend span demo.order.process:
  // upsert and read back for "ok", a rejected order for "business_error", a
  // trigger-raised duplicate for "db_error".
  rpc PlaceOrder(PlaceOrderRequest) returns (PlaceOrderResponse);
  // GetOrder reads one stored order by id; NOT_FOUND when absent.
  rpc GetOrder(GetOrderRequest) returns (Order);
}

// PlaceOrderRequest mirrors the worker's HTTP body
// {"order_id", "customer", "amount", "scenario"} (DE-D7).
message PlaceOrderRequest {
  string order_id = 1;
  string customer = 2;
  double amount = 3;
  // One of "ok", "business_error", "db_error" ("unhandled" fails in the api
  // before the call).
  string scenario = 4;
}

message PlaceOrderResponse {
  // The id stored by the backend (for "ok": ok-<seq mod 500>, DE-D4).
  string order_id = 1;
  // "processed" on success.
  string status = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

// Order is one row of the per-language orders table (demo/sql/schema.sql).
message Order {
  string order_id = 1;
  string customer = 2;
  double amount = 3;
  string scenario = 4;
  // RFC 3339 timestamp of the last upsert.
  string updated_at = 5;
}
