site_name: StaffOps — OTel Libs
site_description: Standardized OpenTelemetry instrumentation libraries for Go, Python, Node.js and .NET
site_url: https://staffops.github.io/otel-libs/
repo_url: https://github.com/StaffOps/otel-libs
repo_name: StaffOps/otel-libs
edit_uri: edit/main/docs/site/

docs_dir: docs/site

theme:
  name: material
  custom_dir: docs/site/overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  language: en

nav:
  - Overview: index.md
  - Library:
      - Overview and parity: library/overview.md
      - Auto-instrumentation: library/auto-instrumentation.md
      - Custom spans, metrics and logs: library/custom-signals.md
      - Go:
          - Overview: go/README.md
          - HOW-TO Guide: go/HOW-TO.md
          - Examples: go/example/README.md
      - Python:
          - Overview: python/README.md
          - HOW-TO Guide: python/HOW-TO.md
          - Examples: python/example/README.md
          - Example Details: python/example/EXAMPLES.md
      - Node.js:
          - Overview: nodejs/README.md
          - HOW-TO Guide: nodejs/HOW-TO.md
          - Examples: nodejs/example/README.md
          - Example Details: nodejs/example/EXAMPLES.md
          - Packages:
              - otel-helper: nodejs/packages/otel-helper.md
              - otel-helper-sql: nodejs/packages/otel-helper-sql.md
              - otel-helper-redis: nodejs/packages/otel-helper-redis.md
              - otel-helper-aws: nodejs/packages/otel-helper-aws.md
              - otel-helper-pino: nodejs/packages/otel-helper-pino.md
              - otel-helper-winston: nodejs/packages/otel-helper-winston.md
      - .NET:
          - Overview: dotnet/README.md
          - HOW-TO Guide: dotnet/HOW-TO.md
          - Examples: dotnet/example/README.md
          - Example Details: dotnet/example/EXAMPLES.md
      - Consuming packages: CONSUMING.md
  - Observability:
      - Overview: observe/overview.md
      - Signals:
          - Traces: observe/signals/traces.md
          - Metrics: observe/signals/metrics.md
          - Logs: observe/signals/logs.md
          - Profiles: observe/signals/profiles.md
      - Correlation: observe/correlation.md
      - Diagnosis:
          - RED: observe/diagnosis/red.md
          - Errors: observe/diagnosis/errors.md
          - Latency and saturation: observe/diagnosis/latency-saturation.md
          - Database: observe/diagnosis/database.md
  - Dashboards:
      - Overview: dashboards/overview.md
  - Platform:
      - Collector prerequisites: platform/collector.md
  - Contributing:
      - Overview: contributing/index.md
      - Handoff: handoff.md
      - Tests:
          - Go: go/TESTS.md
          - Python: python/TESTS.md
          - Node.js: nodejs/TESTS.md
          - .NET: dotnet/TESTS.md
      - Specs & Decisions: https://github.com/StaffOps/otel-libs/blob/main/specs/README.md
  - Changelog & Migration: CHANGELOG.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StaffOps
  generator: false

copyright: Copyright &copy; StaffOps Contributors — Apache 2.0
