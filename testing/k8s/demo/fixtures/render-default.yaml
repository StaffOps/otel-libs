---
apiVersion: v1
kind: Secret
metadata:
  name: demo-postgres-auth
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-postgres-auth
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<generated>"
  demo_go: "<generated>"
  demo_python: "<generated>"
  demo_node: "<generated>"
  demo_dotnet: "<generated>"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-postgres-initdb
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-postgres-initdb
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
type: Opaque
stringData:
  10-roles.sql: |
    -- Generated by testing/k8s/demo/demo.sh for run r1 (DE-D13).
    -- log_min_error_statement=panic: a failing statement is not echoed to
    -- the server log (psql may still print the failing line, a verifier,
    -- never a password, to the container log: DE-D13).
    SET log_min_error_statement = panic;
    CREATE ROLE demo_go LOGIN PASSWORD '<generated>';
    CREATE DATABASE demo_go OWNER demo_go;
    REVOKE CONNECT, TEMPORARY ON DATABASE demo_go FROM PUBLIC;
    GRANT CONNECT ON DATABASE demo_go TO demo_go;
    CREATE ROLE demo_python LOGIN PASSWORD '<generated>';
    CREATE DATABASE demo_python OWNER demo_python;
    REVOKE CONNECT, TEMPORARY ON DATABASE demo_python FROM PUBLIC;
    GRANT CONNECT ON DATABASE demo_python TO demo_python;
    CREATE ROLE demo_node LOGIN PASSWORD '<generated>';
    CREATE DATABASE demo_node OWNER demo_node;
    REVOKE CONNECT, TEMPORARY ON DATABASE demo_node FROM PUBLIC;
    GRANT CONNECT ON DATABASE demo_node TO demo_node;
    CREATE ROLE demo_dotnet LOGIN PASSWORD '<generated>';
    CREATE DATABASE demo_dotnet OWNER demo_dotnet;
    REVOKE CONNECT, TEMPORARY ON DATABASE demo_dotnet FROM PUBLIC;
    GRANT CONNECT ON DATABASE demo_dotnet TO demo_dotnet;
    -- Each role reaches its own database only.
    REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
    REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;
    RESET log_min_error_statement;
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-redis-auth
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-redis-auth
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
type: Opaque
stringData:
  password: "<generated>"
  redis.conf: |
    bind * -::*
    port 6379
    protected-mode yes
    requirepass <generated>
    save ""
    appendonly no
    dir /data
    maxmemory 64mb
    maxmemory-policy noeviction
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-postgres
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-postgres
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-postgres
        app.kubernetes.io/part-of: otel-libs
        app.kubernetes.io/component: demo
        otel-libs/run: "r1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # The superuser password is a file, not an env value (DE-D13 r3.3).
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 5432}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: auth, mountPath: /run/secrets/postgres, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: initdb
          secret:
            secretName: demo-postgres-initdb
            defaultMode: 0440
        - name: auth
          secret:
            secretName: demo-postgres-auth
            defaultMode: 0440
            items:
              - {key: POSTGRES_PASSWORD, path: POSTGRES_PASSWORD}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-postgres
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-postgres
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
spec:
  selector:
    app.kubernetes.io/name: demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      appProtocol: tcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-redis
  namespace: dev-otel-libs
  labels:
    app.kubernetes.io/name: demo-redis
    app.kubernetes.io/part-of: otel-libs
    app.kubernetes.io/component: demo
    otel-libs/run: "r1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-redis
        app.kubernetes.io/part-of: otel-libs
        app.kubernetes.io/component: demo
        otel-libs/run: "r1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          # The probes read the password from the mounted file into REDISCLI_AUTH
          # for redis-cli only: never argv, never a container env value (DE-D13 r3.3).
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$(cat /etc/redis/password)\" redis-cli ping | grep -qx PONG"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=\"$(cat /etc/redis/password)\" redis-cli ping | grep -qx PONG"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: conf, mountPath: /etc/redis, readOnly: true}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {}
        - name: conf
          secret:
            secretName: demo-redis-auth
            defaultMode: 0440
            items:
              - {key: redis.conf, path: redis.conf}
              - {key: password, path: password}
---
