# Test harness for the parity fixture (parity/cases.json) and the e2e smoke.
#
#   docker compose -f testing/docker-compose.yml run --rm go-tests
#   docker compose -f testing/docker-compose.yml run --rm python-tests
#   PY_VERSION=3.10 PY_DEPS=lower docker compose -f testing/docker-compose.yml run --rm python-tests
#   docker compose -f testing/docker-compose.yml run --rm dotnet-tests
#     (also starts sql-postgres and sql-mysql for StaffOps.OtelHelper.Sql; stop them afterwards
#      with `docker compose -f testing/docker-compose.yml stop sql-postgres sql-mysql`)
#   NODE_VERSION=22.15.0 docker compose -f testing/docker-compose.yml run --rm node-tests
#     (also starts sql-postgres and sql-mysql for @staffops/otel-helper-sql and
#      redis-test for @staffops/otel-helper-redis; stop them afterwards with
#      `docker compose -f testing/docker-compose.yml stop sql-postgres sql-mysql redis-test`)
#   testing/e2e/smoke.sh
#
# Each suite has its own receiver (fakeotlp-go / fakeotlp-py / fakeotlp-dotnet / fakeotlp-node;
# dotnet-tests shares fakeotlp-dotnet's)
# and shares its network namespace, so the suites can run concurrently without seeing each
# other's requests. Two runs of the SAME suite at once need separate projects
# (`docker compose -p <name> ...`). The receiver binds only the case addresses
# (127.0.0.2, 127.0.0.3, [::1]:24318): other unit tests exporting to
# localhost:4317 get connection-refused instead of polluting the request log.
# CI uses the same addresses with `--network host` (.github/actions/fakeotlp).
name: otel-libs-testing

x-fakeotlp: &fakeotlp
  build: ./fakeotlp
  image: otel-libs/fakeotlp:local
  # Listen addresses: the receiver's defaults (127.0.0.2, 127.0.0.3:4317 TLS, [::1]:24318).
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.2:8888/requests"]
    interval: 1s
    timeout: 2s
    retries: 30

x-fakeotlp-env: &fakeotlp-env
  FAKEOTLP_HOST: 127.0.0.2
  FAKEOTLP_HOST_TLS: 127.0.0.3
  FAKEOTLP_HOST_IPV6: "[::1]"
  FAKEOTLP_ADMIN: http://127.0.0.2:8888
  FAKEOTLP_CA: /fakeotlp/ca.pem
  PARITY_REQUIRE_FAKEOTLP: "1"
  # Parity release gate (parity/README.md): `testing/verify.sh --release` sets 1;
  # empty (the default) skips the gate tests in go-tests, python-tests, node-tests and dotnet-tests.
  PARITY_RELEASE: ${PARITY_RELEASE:-}

services:
  fakeotlp-go:
    <<: *fakeotlp
    volumes: [fakeotlp-go-out:/out]

  fakeotlp-py:
    <<: *fakeotlp
    volumes: [fakeotlp-py-out:/out]

  fakeotlp-dotnet:
    <<: *fakeotlp
    volumes: [fakeotlp-dotnet-out:/out]

  fakeotlp-node:
    <<: *fakeotlp
    volumes: [fakeotlp-node-out:/out]
    # DNS names for the receiver addresses, seen by node-tests through the shared
    # network namespace (it gets this container's /etc/hosts). Node 26 refuses an
    # IP literal as TLS ServerName (design D-JS14, spike B1c F5); the certificate
    # carries both names (fakeotlp's default TLS_HOSTS).
    extra_hosts:
      - "fakeotlp:127.0.0.2"
      - "fakeotlp-tls:127.0.0.3"

  go-tests:
    # Debian-based image: `-race` needs cgo + gcc. Version follows go.mod (go 1.26).
    image: golang:1.26
    network_mode: "service:fakeotlp-go"
    depends_on:
      fakeotlp-go:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    working_dir: /src/go
    environment:
      <<: *fakeotlp-env
      # ext/otelredis A26 real-server tests (throwaway password).
      OTELREDIS_TEST_ADDR: redis-test:6379
      OTELREDIS_TEST_PASSWORD: otel-test-only
    volumes:
      - ..:/src:ro
      - fakeotlp-go-out:/fakeotlp:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    # Parity children write coverage to PARITY_GOCOVERDIR; it is merged into
    # the profile before the gate (go tool cover sums duplicate blocks).
    command:
      - sh
      - -ec
      - |
        rm -rf /tmp/covdir && mkdir -p /tmp/covdir
        PARITY_GOCOVERDIR=/tmp/covdir go test -race -count=1 ./... -coverprofile=/tmp/coverage.out -covermode=atomic
        go tool covdata textfmt -i=/tmp/covdir -o /tmp/parity.out
        tail -n +2 /tmp/parity.out >> /tmp/coverage.out
        go tool cover -func=/tmp/coverage.out | tail -1
        # ext/otelredis against miniredis and the real redis-test (A26).
        (cd ext/otelredis && go vet ./... && go test -count=1 -cover ./...)

  python-tests:
    image: python:${PY_VERSION:-3.13}-slim
    network_mode: "service:fakeotlp-py"
    depends_on:
      fakeotlp-py:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      <<: *fakeotlp-env
      PY_DEPS: ${PY_DEPS:-latest}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PARITY_CASES: /src/parity/cases.json
      PARITY_COVERAGE_DATA: /work/.coverage
      # tests/test_a26_redis.py real-server cases (throwaway password).
      REDIS_TEST_URL: redis://default:otel-test-only@redis-test:6379/0
    volumes:
      - ../python:/src/python:ro
      - ../parity:/src/parity:ro
      - fakeotlp-py-out:/fakeotlp:ro
      - pip-cache:/root/.cache/pip
    # Copy out of the read-only mount so the editable install never writes into the repo.
    command:
      - sh
      - -ec
      - |
        cp -r /src/python /work && cd /work
        pip install -q -c ci/$${PY_DEPS}.txt -e '.[dev,all]'
        pip list 2>/dev/null | grep -E '^opentelemetry-(sdk|instrumentation) '
        python -m pytest tests/ -p no:cacheprovider -q --cov=staffops_otel_helper --cov=otel_helper --cov-report=term --cov-fail-under=90

  dotnet-tests:
    # sdk:8.0 until C0 (net8.0-only on this branch, specs/dotnet-otel-helper D-NET12).
    image: mcr.microsoft.com/dotnet/sdk:8.0
    network_mode: "service:fakeotlp-dotnet"
    depends_on:
      fakeotlp-dotnet:
        condition: service_healthy
      sql-postgres:
        condition: service_healthy
      sql-mysql:
        condition: service_healthy
    environment:
      <<: *fakeotlp-env
      PARITY_CASES: /src/parity/cases.json
      PARITY_TASKS: /src/specs/dotnet-otel-helper/tasks.md
      # StaffOps.OtelHelper.Sql integration tests (task C14a; throwaway credentials, the
      # node-tests URLs). REQUIRE (default 1): a missing URL fails instead of skipping.
      # Stop the databases afterwards: `docker compose -f testing/docker-compose.yml stop sql-postgres sql-mysql`.
      SQL_TEST_POSTGRES: postgres://otel:otel-test-only@sql-postgres:5432/otel_test
      SQL_TEST_MYSQL: mysql://otel:otel-test-only@sql-mysql:3306/otel_test
      SQL_TEST_REQUIRE: ${SQL_TEST_REQUIRE:-1}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # vstest kills the test host ~100 ms after the last test, before coverlet
      # writes its hit files (dotnet/TESTS.md).
      VSTEST_TESTHOST_SHUTDOWN_TIMEOUT: "10000"
    volumes:
      - ..:/src:ro
      - fakeotlp-dotnet-out:/fakeotlp:ro
      - nuget-cache:/root/.nuget/packages
    # A container-local copy: bin/obj from another platform never reach the build,
    # and the repository stays read-only. Parity children run instrumented
    # assemblies from the test output folder, so coverlet merges their hits.
    command:
      - sh
      - -ec
      - |
        mkdir -p /work && cd /src/dotnet
        tar --exclude=bin --exclude=obj --exclude=coverage -cf - . | tar -xf - -C /work
        cd /work
        dotnet test StaffOps.OtelHelper.Tests -c Release \
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./coverage/ \
          /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total \
          /p:Exclude="[xunit*]*%2c[StaffOps.OtelHelper.ParityDriver]*"

  # Databases for @staffops/otel-helper-sql (Node task B10a) and the
  # StaffOps.OtelHelper.Sql integration tests (.NET task C14a), used by node-tests and
  # dotnet-tests. Throwaway credentials; data on tmpfs (no volume is created).
  # Each suite reaches them by service name through its fakeotlp container's network.
  sql-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: otel
      POSTGRES_PASSWORD: otel-test-only
      POSTGRES_DB: otel_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "otel", "-d", "otel_test"]
      interval: 1s
      timeout: 2s
      retries: 60

  sql-mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: otel
      MYSQL_PASSWORD: otel-test-only
      MYSQL_DATABASE: otel_test
    tmpfs: [/var/lib/mysql]
    # TCP only answers once the init server (no networking) has been replaced.
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uotel", "-potel-test-only", "-e", "SELECT 1", "otel_test"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  # Redis for @staffops/otel-helper-redis (Node task B10b) and the A26
  # real-server tests of Go ext/otelredis and Python ext.redis; used by
  # node-tests, go-tests and python-tests. Throwaway password (the AUTH/NOAUTH tests need one); no
  # persistence, data on tmpfs (no volume is created).
  redis-test:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--requirepass", "otel-test-only", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "otel-test-only", "--no-auth-warning", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60

  node-tests:
    # NODE_VERSION: CI matrix 22.15.0 (engines floor), 22, 24, 26 (spec JS1).
    image: node:${NODE_VERSION:-24}-slim
    network_mode: "service:fakeotlp-node"
    depends_on:
      fakeotlp-node:
        condition: service_healthy
      sql-postgres:
        condition: service_healthy
      sql-mysql:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    environment:
      <<: *fakeotlp-env
      # Receivers by DNS name (extra_hosts on fakeotlp-node): {receiver} and
      # {receiver_tls} expand to names on the Node legs, IPs for Go/Python.
      FAKEOTLP_HOST: fakeotlp
      FAKEOTLP_HOST_TLS: fakeotlp-tls
      PARITY_CASES: /src/parity/cases.json
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
      # 1 = skip the registry-dependent api-range install test (offline runs).
      NODE_TESTS_OFFLINE: ${NODE_TESTS_OFFLINE:-}
      # @staffops/otel-helper-sql database tests (throwaway credentials); REQUIRE
      # (default 1) makes a missing database URL fail the suite instead of
      # skipping. NODE_TESTS_OFFLINE does not stop the databases from starting:
      # their images must be present locally (pulled once).
      SQL_TEST_POSTGRES: postgres://otel:otel-test-only@sql-postgres:5432/otel_test
      SQL_TEST_MYSQL: mysql://otel:otel-test-only@sql-mysql:3306/otel_test
      SQL_TEST_REQUIRE: ${SQL_TEST_REQUIRE:-1}
      # @staffops/otel-helper-redis tests (throwaway password); the same REQUIRE rule.
      REDIS_TEST_URL: redis://default:otel-test-only@redis-test:6379/0
      REDIS_TEST_REQUIRE: ${REDIS_TEST_REQUIRE:-1}
    volumes:
      - ..:/src:ro
      - fakeotlp-node-out:/fakeotlp:ro
      - npm-cache:/root/.npm
    # Copy out of the read-only mount without host node_modules/dist (they may
    # hold another platform's files), so nothing is written into the repo.
    # Lifecycle scripts never run (`--ignore-scripts`, also set in nodejs/.npmrc).
    command:
      - sh
      - -ec
      - |
        mkdir -p /work
        tar -C /src/nodejs --exclude=node_modules --exclude=dist --exclude=coverage --exclude='*.tgz' -cf - . | tar -C /work -xf -
        cd /work
        node --version
        for p in packages/*; do cmp /src/LICENSE "$$p/LICENSE"; done
        npm ci --ignore-scripts
        npm ls --all >/dev/null && echo 'npm ls: installed tree is valid'
        npm run lint
        npm run build
        npm run typecheck
        npm run check
        node ci/check-pack.mjs
        # Release version tool (task B13): its tests also check that every
        # version location of the workspace agrees.
        node --test 'ci/*.test.mjs'
        # Includes the parity runner (test/parity/runner.test.cjs, run by the core
        # package's test script so its children count towards the coverage gate).
        npm test
        sh ci/api-range-install.sh

  # ── e2e smoke (testing/e2e/smoke.sh) ──────────────────────────────────
  e2e-certs:
    # CA + server certificate for the Collector's TLS receiver (fakeotlp's cert mode).
    image: otel-libs/fakeotlp:local
    build: ./fakeotlp
    profiles: ["e2e"]
    environment:
      CERTS_ONLY: "1"
      TLS_HOSTS: collector
    volumes: [e2e-certs:/out]

  collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    profiles: ["e2e"]
    depends_on:
      e2e-certs:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./e2e/collector.yaml:/etc/otelcol/config.yaml:ro
      - e2e-certs:/certs:ro

  go-smoke:
    image: golang:1.26
    profiles: ["e2e"]
    working_dir: /src/testing/e2e
    volumes:
      - ..:/src:ro
      - e2e-certs:/certs:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["sh", "run-go.sh"]

  python-smoke:
    # Same base as python/example/python-process/Dockerfile (its aiohttp pin has no 3.13 wheel).
    image: python:3.11-slim
    profiles: ["e2e"]
    working_dir: /src/testing/e2e
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ../python:/src/python:ro
      - ./e2e:/src/testing/e2e:ro
      - e2e-certs:/certs:ro
      - pip-cache:/root/.cache/pip
    command: ["sh", "run-python.sh"]

  node-smoke:
    # Node task B11a. Same base as node-tests; NODE_VERSION picks another line.
    image: node:${NODE_VERSION:-24}-slim
    profiles: ["e2e"]
    working_dir: /src/testing/e2e
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    volumes:
      - ..:/src:ro
      - e2e-certs:/certs:ro
      - npm-cache:/root/.npm
    command: ["sh", "run-node.sh"]

volumes:
  fakeotlp-go-out:
  fakeotlp-py-out:
  fakeotlp-dotnet-out:
  fakeotlp-node-out:
  go-mod-cache:
  go-build-cache:
  pip-cache:
  npm-cache:
  nuget-cache:
  e2e-certs:
